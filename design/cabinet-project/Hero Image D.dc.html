<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F1EFE8}
a{color:#111}a:hover{color:#C93A5C}
@keyframes bd-card{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="position:relative;width:100%;height:100vh;min-height:560px;overflow:hidden;background:#8E2140">
  <canvas ref="{{ cvRef }}" style="position:absolute;inset:0;display:block;image-rendering:pixelated"></canvas>
  <canvas ref="{{ cvTRef }}" style="position:absolute;inset:0;display:block;pointer-events:none"></canvas>
  <sc-if value="{{ showCard }}" hint-placeholder-val="{{ true }}">
    <div key="{{ cardKey }}" style="position:absolute;left:32px;bottom:32px;width:236px;background:#F1EFE8;border:1.5px solid #40101F;box-shadow:5px 5px 0 rgba(20,4,10,.55);padding:15px;animation:bd-card .4s steps(3) both">
      <div style="display:grid;grid-template-columns:repeat(4,5px);gap:3px;margin-bottom:10px">
        <sc-for list="{{ glyphCells }}" as="c" hint-placeholder-count="12">
          <div style="width:5px;height:5px;border:1px solid #8E2140;background:{{ c.bg }}"></div>
        </sc-for>
      </div>
      <div style="font:600 11.5px 'IBM Plex Mono';letter-spacing:.15em;text-transform:uppercase;color:#2A0E18">{{ cardLabel }}</div>
      <div style="font:400 9.5px/1.5 'IBM Plex Mono';color:rgba(42,14,24,.7);margin-top:6px">{{ cardSub }}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:11px">
        <div style="display:flex;gap:4px">
          <sc-for list="{{ dashes }}" as="d" hint-placeholder-count="6">
            <div style="width:14px;height:2px;background:{{ d.bg }}"></div>
          </sc-for>
        </div>
        <div style="font:500 9px 'IBM Plex Mono';color:rgba(42,14,24,.55)">{{ cardCount }}</div>
      </div>
    </div>
  </sc-if>
  <div style="position:absolute;top:20px;right:22px;font:500 9px 'IBM Plex Mono';letter-spacing:.16em;color:rgba(241,239,232,.6)">THE INDEX · TWENTY-TWO CONTROLS · SCORED</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:760},&quot;pixelSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:4,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Dither&quot;},&quot;showCard&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Overlays&quot;},&quot;cycleSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4,&quot;min&quot;:2,&quot;max&quot;:8,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Overlays&quot;}}">

      }
      if (this.plate) {
        ctT.font = '600 10px "IBM Plex Mono",monospace';
        ctT.fillStyle = '#40101F';
        ctT.fillText('THE INDEX', this.plate.x * pxs, this.plate.y * pxs + 1);
      }
    }
  }
  renderVals() {
    const i = this.state.idx, cat = this.CATS[i];
    const cells = [];
    for (let c = 0; c < 12; c++) cells.push({ bg: ((c * 5 + i * 7) % 11) < 5 ? '#8E2140' : 'transparent' });
    const dashes = this.CATS.map((_, d) => ({ bg: d === i ? '#8E2140' : 'rgba(142,33,64,.25)' }));
    return {
      cvRef: this.cvRef,
      cvTRef: this.cvTRef,
      cardLabel: cat.l,
      cardSub: cat.s,
      cardCount: '0' + (i + 1) + ' / 06',
      cardKey: 'card-' + i,
      glyphCells: cells,
      dashes: dashes,
      showCard: this.props.showCard ?? true
    };
  }
}
</script>
</body>
</html>
