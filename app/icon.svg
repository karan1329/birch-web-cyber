  <text
    x="16" y="23"
    text-anchor="middle"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="21"
    font-weight="700"
    letter-spacing="0.5"
    fill="#F1EEE7"
  >B</text>
</svg>
