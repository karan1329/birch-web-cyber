<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Birchlogic">
  <!--
    INTERIM MARK. This is the wordmark's initial set on the brand ground, not
    a logo: there is no logo file in this repository, and inventing one is not
